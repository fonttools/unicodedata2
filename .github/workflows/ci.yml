name: Build + Deploy

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
    branches: [master]

env:
  # cibuildwheel 3.0 moved PyPy into an opt-in "enable group", which silently
  # dropped the PyPy wheels this project had shipped up to 16.0.0 (17.0.0 and
  # 17.0.1 published none). Ask for them back explicitly.
  CIBW_ENABLE: pypy
  CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
  CIBW_MANYLINUX_I686_IMAGE: manylinux2014
  CIBW_MANYLINUX_PYPY_X86_64_IMAGE: manylinux2014
  CIBW_TEST_EXTRAS: testing
  CIBW_TEST_COMMAND: pytest {project}/tests

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    env:
      CIBW_ARCHS: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-11-arm, windows-latest]
        arch: [auto64]
        include:
          - os: macos-latest
            arch: universal2
          - os: windows-latest
            arch: x86
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Set up Python 3.x
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: pip install cibuildwheel
    - name: Download normalization test data
      run: python tests/download_test_data.py
    - name: Build and Test Wheels
      run: python -m cibuildwheel --output-dir wheelhouse
    - uses: actions/upload-artifact@v7
      with:
        name: unicodedata2-${{ matrix.os }}-${{ matrix.arch }}
        path: wheelhouse/*.whl

  deploy:
    # only run if the commit is tagged...
    if: github.ref_type == 'tag'
    # ... and all build jobs completed successfully
    needs: [build_wheels]
    runs-on: ubuntu-latest
    environment:
      name: publish-to-pypi
      url: https://pypi.org/p/unicodedata2
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
      contents: write # Needed to create GH release
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade build twine
    - name: Download artifacts from build jobs
      uses: actions/download-artifact@v8
      with:
        path: wheelhouse/
    - name: Move wheels to dist/ directory
      run: |
        ls wheelhouse/*
        mkdir -p dist/
        for wheel_dir in wheelhouse/unicodedata2*/; do
          mv "${wheel_dir}"/*.whl dist/
        done
    - name: Extract release notes from annotated tag message
      id: release_notes
      run: |
        # GH checkout action doesn't preserve tag annotations, we must fetch them
        # https://github.com/actions/checkout/issues/290
        git fetch --tags --force
        # strip leading 'refs/tags/' to get the tag name
        TAG_NAME="${GITHUB_REF##*/}"
        # Dump tag message to temporary .md file (excluding the PGP signature at the bottom)
        TAG_MESSAGE=$(git tag -l --format='%(contents)' $TAG_NAME | sed -n '/-----BEGIN PGP SIGNATURE-----/q;p')
        echo "$TAG_MESSAGE" > "${{ runner.temp }}/release_notes.md"
    - name: Create GitHub release
      id: create_release
      uses: actions/create-release@v1
      env:
        # This token is provided by Actions, you do not need to create your own token
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: ${{ github.ref }}
        body_path: "${{ runner.temp }}/release_notes.md"
        draft: false
        prerelease: false
    - name: Build sdist
      run: python -m build --sdist
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
